services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: haulage-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-haulage_truck_management}
      MYSQL_USER: ${MYSQL_USER:-haulage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-userpass123}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haulage-network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haulage-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-haulage_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-userpass123}
      DB_NAME: ${MYSQL_DATABASE:-haulage_truck_management}
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - haulage-network

  # React Frontend
  frontend:
    build:
      context: ./react
      dockerfile: Dockerfile
    container_name: haulage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - haulage-network

volumes:
  db_data:

networks:
  haulage-network:
    driver: bridge
